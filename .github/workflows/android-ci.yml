name: Android CI

on:
  push:
    branches: [ "master", "main" ]   # <-- ahora cubre master y main
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:                  # <-- botón "Run workflow" manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug
        run: ./gradlew assembleDebug --stacktrace --warning-mode all

      - name: Unit tests
        run: ./gradlew test --stacktrace --warning-mode all

      - name: Build Release AAB (unsigned)
        run: ./gradlew :app:bundleRelease --stacktrace --warning-mode all

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: dayssince-release-aab
          path: app/build/outputs/bundle/release/*.aab   # ajusta "app" si tu módulo se llama distinto
